<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lystrup IF - Infoskærm</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #9c1717;
    --red-dark: #6b0f0f;
    --red-light: #b81f1f;
    --bg: #ffffff;
    --bg2: #f4f4f4;
    --bg3: #ececec;
    --text: #1a1a1a;
    --muted: #777;
    --border: #e0e0e0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000;
  }

  body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    transform-origin: top left;
  }

  /* GRID: header | content | sponsor */
  .screen {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 90px 902px 88px;
    width: 1920px; height: 1080px;
  }

  /* ─── HEADER ─── */
  .header {
    grid-column: 1 / -1; grid-row: 1;
    background: var(--red);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 36px;
    border-bottom: 4px solid var(--red-dark);
    position: relative; overflow: hidden; gap: 20px;
  }
  .header::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(-45deg, transparent, transparent 18px, rgba(0,0,0,0.04) 18px, rgba(0,0,0,0.04) 19px);
    pointer-events: none;
  }

  .club-brand { display: flex; align-items: center; gap: 16px; flex-shrink: 0; z-index: 1; }
  .club-logo { height: 58px; width: auto; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
  .club-name { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 4px; color: #fff; line-height: 1; white-space: nowrap; }

  .header-date {
    font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 4px;
    color: #ffffff; text-transform: uppercase;
    position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 1;
  }

  .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; z-index: 1; }

  .header-weather {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px 18px;
    height: 68px;
  }
  .hw-icon { font-size: 28px; line-height: 1; }
  .hw-temp { font-family: 'Bebas Neue', sans-serif; font-size: 38px; color: #fff; line-height: 1; letter-spacing: 1px; }
  .hw-desc { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 1px; display: block; margin-top: 2px; }

  .header-wind {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px 18px;
    height: 68px;
  }
  .hw-wind-arrow { font-size: 26px; color: #fff; line-height: 1; display: inline-block; transform-origin: center; transition: transform 1s ease; }
  .hw-wind-info { display: flex; flex-direction: column; }
  .hw-wind-speed { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; line-height: 1; letter-spacing: 1px; }
  .hw-wind-dir { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 2px; }
  .hw-wind-sub { font-size: 10px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.8px; }

  /* Digitalt ur i header */
  .header-clock {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px 20px;
    height: 68px; flex-shrink: 0;
  }
  .header-clock-time {
    font-family: 'Bebas Neue', sans-serif; font-size: 38px; color: #fff;
    line-height: 1; letter-spacing: 4px;
  }
  .header-clock-time .colon { animation: blink 1s step-end infinite; }

  /* ─── KAMPPROGRAM ─── */
  .matches-panel {
    grid-column: 1; grid-row: 2;
    padding: 28px 40px 20px 40px;
    display: flex; flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
    background: #fff;
    height: 902px; max-height: 902px;
  }
  .panel-title {
    font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: 2px; color: var(--red);
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border);
  }
  .panel-title-bar { width: 4px; height: 32px; background: var(--red); border-radius: 2px; flex-shrink: 0; }
  .matches-list { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden; }

  .match-card {
    background: var(--bg2); border: 1px solid var(--border); border-left: 4px solid #ddd;
    border-radius: 6px; padding: 14px 24px;
    display: grid; grid-template-columns: 100px 1fr auto; align-items: center; gap: 20px;
  }
  .match-card.next-match { border-left-color: var(--red); background: #fff8f8; }
  .match-date-col { text-align: center; }
  .match-date-day { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--red); line-height: 1; }
  .match-date-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .match-teams { display: flex; flex-direction: column; gap: 3px; }
  .match-teams-row { display: flex; align-items: center; gap: 10px; }
  .match-team { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; color: var(--text); }
  .match-vs { font-size: 13px; color: var(--muted); font-weight: 600; }
  .match-league { font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 3px; letter-spacing: 0.4px; }
  .next-badge { display: inline-block; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 3px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; width: fit-content; }
  .match-omk { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .omk-badge { font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 4px; white-space: nowrap; }
  .omk-hjem  { background: #e8f4fd; color: #2471a3; border: 1px solid #aed6f1; }
  .omk-ude   { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
  .omk-dom   { background: #fef9e7; color: #b7950b; border: 1px solid #f9e79f; }
  .omk-sep   { color: #ccc; font-size: 14px; }
  .match-time-col { text-align: right; }
  .match-time { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--text); letter-spacing: 2px; line-height: 1; }

  .match-bane-col {
    text-align: center; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .match-bane-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase; color: var(--text);
  }
  .match-bane-value {
    font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px;
    color: #fff; line-height: 1;
    border-radius: 6px; padding: 4px 14px;
    background: var(--red); /* default - overskrives af JS */
  }

  .no-matches { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; font-style: italic; }
  .loading-pulse { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* ─── HØJRE KOLONNE ─── */
  .right-col {
    grid-column: 2; grid-row: 2;
    display: flex; flex-direction: column;
    background: var(--bg2);
    height: 902px; max-height: 902px; overflow: hidden;
  }
  .field-panel {
    flex: 1; min-height: 0;
    padding: 18px 18px 12px 18px;
    display: flex; flex-direction: column; overflow: hidden;
    height: 100%; max-height: 100%;
  }
  .field-image-container {
    flex: 1; min-height: 0; max-height: 820px;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    background: #2d3d2a;
    display: flex; align-items: center; justify-content: center;
    margin-top: 12px;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
  }
  .field-image-container img {
    width: 100%; height: 100%; object-fit: contain;
    filter: url(#sharpen) contrast(1.1) saturate(1.1);
  }

  /* ─── FRIVILLIG CTA ─── */
  .volunteer-cta {
    flex-shrink: 0;
    height: 116px;
    background: var(--red);
    border-top: 3px solid var(--red-dark);
    display: flex; align-items: center; gap: 20px;
    padding: 0 24px;
  }
  .volunteer-qr {
    flex-shrink: 0;
    width: 92px; height: 92px;
    background: #fff; border-radius: 8px; padding: 6px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .volunteer-qr img { width: 100%; height: 100%; }
  .volunteer-text { display: flex; flex-direction: column; gap: 4px; color: #fff; min-width: 0; }
  .volunteer-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1.5px; line-height: 1.05; text-transform: uppercase; }
  .volunteer-sub { font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.9); line-height: 1.3; }

  /* ─── SPONSOR BAR ─── */
  .sponsor-bar {
    grid-column: 1 / -1; grid-row: 3;
    background: var(--red);
    border-top: 3px solid var(--red-dark);
    display: flex; align-items: center; justify-content: center;
    gap: 80px; padding: 0 60px;
    overflow: hidden;
  }
  .sponsor-label {
    font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 5px;
    color: #ffffff; text-transform: uppercase; flex-shrink: 0;
    white-space: nowrap;
  }
  .sponsor-divider { width: 1px; height: 44px; background: rgba(255,255,255,0.2); flex-shrink: 0; }
  .sponsor-item { display: flex; align-items: center; justify-content: center; flex-shrink: 0; height: 70px; padding: 0 8px; }
  .sponsor-item img { max-height: 52px; max-width: 220px; object-fit: contain; background: #fff; border-radius: 6px; padding: 6px 12px; }
  .sponsor-name-text { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: rgba(255,255,255,0.7); letter-spacing: 2px; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

  .page-indicator {
    margin-left: auto;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px;
    color: var(--muted); background: var(--bg3);
    padding: 3px 12px; border-radius: 4px;
    opacity: 0; transition: opacity 0.3s;
  }
  .page-indicator.visible { opacity: 1; }
  .cursor-hidden, .cursor-hidden * { cursor: none !important; }
</style>
</head>
<body>
<div class="screen">

  <!-- HEADER -->
  <header class="header">
    <div class="club-brand">
      <img src="https://587-lystrup-if.euwest01.umbraco.io/media/1484/lif-original-logo.png" alt="Lystrup IF" class="club-logo" onerror="this.style.display='none'">
      <div class="club-name">Lystrup IF Fodbold</div>
    </div>
    <div class="header-date" id="header-date">—</div>
    <div class="header-right">
      <div class="header-weather">
        <span class="hw-icon" id="weather-icon">🌤️</span>
        <div>
          <span class="hw-temp" id="weather-temp">—°</span>
          <span class="hw-desc" id="weather-desc">Henter…</span>
        </div>
      </div>
      <div class="header-wind">
        <span class="hw-wind-arrow" id="wind-arrow">↑</span>
        <div class="hw-wind-info">
          <span class="hw-wind-speed" id="wind-speed">—</span>
          <span class="hw-wind-dir" id="wind-dir">—</span>
          <span class="hw-wind-sub" id="wind-gusts"></span>
          <span class="hw-wind-sub" id="wind-beaufort"></span>
        </div>
      </div>
      <div class="header-clock">
        <div class="header-clock-time">
          <span id="clock-h">00</span><span class="colon">:</span><span id="clock-m">00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- KAMPPROGRAM -->
  <section class="matches-panel">
    <div class="panel-title">
      <div class="panel-title-bar"></div>
      <span>Dagens kampe</span>
      <span class="page-indicator" id="page-indicator"></span>
    </div>
    <div class="matches-list" id="matches-list">
      <div class="no-matches loading-pulse">Henter kampe…</div>
    </div>
  </section>

  <!-- HØJRE: baneoversigt + kampe i morgen -->

let _weatherRetry = 0;
async function fetchWeatherWithRetry() {
  try {
    await fetchWeather();
    _weatherRetry = 0;
  } catch(e) {
    _weatherRetry++;
    const delay = _weatherRetry <= 5 ? 30000 : 600000;
    setTimeout(fetchWeatherWithRetry, delay);
    return;
  }
}

async function fetchWeather() {
  const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=56.19&longitude=10.22&current=temperature_2m,weather_code,windspeed_10m,winddirection_10m,windgusts_10m&timezone=Europe/Copenhagen');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  const c = d.current.weather_code ?? d.current.weathercode;
  const icons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌦️',95:'⛈️'};
  const descs = {0:'Klart',1:'Næsten klart',2:'Delvist skyet',3:'Overskyet',45:'Tåge',51:'Let regn',61:'Regn',71:'Sne',80:'Regnbyger',95:'Tordenvejr'};
  document.getElementById('weather-icon').textContent = icons[c] || '🌡️';
  document.getElementById('weather-temp').textContent = Math.round(d.current.temperature_2m) + '°';
  document.getElementById('weather-desc').textContent = descs[c] || '—';

  const speed = Math.round(d.current.windspeed_10m / 3.6 * 10) / 10;
  const gusts = Math.round(d.current.windgusts_10m / 3.6 * 10) / 10;
  const deg   = d.current.winddirection_10m;
  const dirs  = ['N','NNØ','NØ','ØNØ','Ø','ØSØ','SØ','SSØ','S','SSV','SV','VSV','V','VNV','NV','NNV'];
  const dirLabel = dirs[Math.round(deg / 22.5) % 16];
  let bf = '';
  if (speed < 1) bf = 'Stille';
  else if (speed < 6)  bf = 'Svag vind';
  else if (speed < 12) bf = 'Let brise';
  else if (speed < 20) bf = 'Svag brise';
  else if (speed < 29) bf = 'Jævn brise';
  else if (speed < 39) bf = 'Frisk brise';
  else if (speed < 50) bf = 'Hård vind';
  else bf = 'Stærk vind';

  document.getElementById('wind-arrow').style.transform = `rotate(${(deg + 180) % 360}deg)`;
  document.getElementById('wind-speed').textContent = speed + ' m/s';
  document.getElementById('wind-dir').textContent = dirLabel;
  document.getElementById('wind-gusts').textContent = 'Vindstød ' + gusts + ' m/s';
  document.getElementById('wind-beaufort').textContent = bf;
}

function getBaneColor(bane) {
  if (!bane) return { bg: '#9c1717', text: '#fff' };
  const b = bane.toUpperCase();
  if (b.startsWith('A8') || b.startsWith('C8'))
                           return { bg: '#d63031', text: '#fff' };   // Rød
  if (b.startsWith('B11')) return { bg: '#27ae60', text: '#fff' };   // Grøn
  if (b.startsWith('B-MM') || b === 'BMM') return { bg: '#2980b9', text: '#fff' }; // Blå
  if (/^C[2-7]/.test(b) || b.startsWith('C-'))
                           return { bg: '#ffe83d', text: '#1a1a1a' }; // Gul (C2–C7)
  if (b.startsWith('D3') || b.startsWith('D-'))
    return { bg: '#00b4d8', text: '#fff' };
  if (b.startsWith('K8') || b.startsWith('K11') || b.startsWith('K-'))
    return { bg: '#e67e22', text: '#fff' };
  return { bg: '#9c1717', text: '#fff' };
}

async function fetchViaProxy(targetUrl) {
  const proxies = [

    () => fetch('http://localhost:8765/dbu', {signal: AbortSignal.timeout(10000)})

          .then(r => { if(!r.ok) throw new Error(); return r.arrayBuffer(); })
          .then(buf => new TextDecoder('windows-1252').decode(buf)),
    () => fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl), {signal: AbortSignal.timeout(8000)})
          .then(r => r.json()).then(j => {
            let h = j.contents || '';
            h = h.replace(/Ã¦/g,'æ').replace(/Ã†/g,'Æ')
                 .replace(/Ã¸/g,'ø').replace(/Ã˜/g,'Ø')
                 .replace(/Ã¥/g,'å').replace(/Ã…/g,'Å')
                 .replace(/Ã©/g,'é')
                 .replace(/æ/g,'æ').replace(/Æ/g,'Æ')
                 .replace(/ø/g,'ø').replace(/Ø/g,'Ø')
                 .replace(/å/g,'å').replace(/Å/g,'Å')
                 .replace(/&aelig;/g,'æ').replace(/&AElig;/g,'Æ')
                 .replace(/&oslash;/g,'ø').replace(/&Oslash;/g,'Ø')
                 .replace(/&aring;/g,'å').replace(/&Aring;/g,'Å');
            return h;
          }),
    () => fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(targetUrl), {signal: AbortSignal.timeout(8000)})
          .then(r => r.arrayBuffer()).then(buf => new TextDecoder('windows-1252').decode(buf)),

function formatDate(d) {
  return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + d.getFullYear();
}

function dateLabel(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const cmp   = new Date(d); cmp.setHours(0,0,0,0);
  const diff  = Math.round((cmp - today) / 86400000);
  const dateStr = d.getDate() + '/' + (d.getMonth()+1);
  if (diff === 0) return { top: dateStr, bottom: 'I dag' };
  if (diff === 1) return { top: dateStr, bottom: 'I morgen' };
  return { top: dateStr, bottom: DAY_NAMES_SHORT[d.getDay()] };
}

// Fix ødelagte danske tegn i enhver streng fra DBU
function fixDansk(s) {
  if (!s) return s;
  return s
    // Erstat alle varianter af ødelagt æ, ø, å
    .replace(/�/g, function(_, offset, str) {
      // Kig på kontekst for at gætte rigtigt tegn
      const before = str.slice(Math.max(0, offset-3), offset).toLowerCase();
      const after  = str.slice(offset+1, offset+4).toLowerCase();
      if (before.endsWith('gr') || before.endsWith('l'))  return 'æ';
      if (before.endsWith('st') || before.endsWith('k'))  return 'ø';
      return 'å';
    })
    // Kendte ord med fejltegn
    .replace(/Kunstgr.sbane/gi,  'Kunstgræsbane')
    .replace(/Kunstgr\?sbane/gi, 'Kunstgræsbane')
    .replace(/gr.sbane/gi,       'græsbane')
    .replace(/Omklæ?dning/gi,    'Omklædning')
    .replace(/Omkl\?dning/gi,    'Omklædning')
    .replace(/Fr\?mad/gi,        'Fremad')
    .replace(/St\?vne/gi,        'Stævne')
    // Generelle erstatninger
    .replace(/æ/g,'æ').replace(/Æ/g,'Æ')
    .replace(/ø/g,'ø').replace(/Ø/g,'Ø')
    .replace(/å/g,'å').replace(/Å/g,'Å');
}

function parseMatchesFromHTML(html, defaultDate) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const rows = doc.querySelectorAll('table tr');
  const matches = [];
  let currentDate = defaultDate;
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    // Detektér dato-overskriftsrækker fra DBU (fx "Lørdag 03-05-2026" eller "03.05.2026")
    if (cells.length < 4) {
      const rowText = row.textContent.trim();
      const dm = rowText.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/);
      if (dm) {
        const [, dd, mm, yyyy] = dm;
        currentDate = new Date(`${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`);
      }
      return;
    }
    const tid     = fixDansk(cells[0]?.textContent.trim());
    const aargang = fixDansk(cells[1]?.textContent.trim());
    const bane    = fixDansk(cells[4]?.textContent.trim());
    if (!tid) return;
    const timeMatch = tid.match(/(\d{1,2}:\d{2})/);
    const startTime = timeMatch ? timeMatch[1] : tid;

    // DBU bruger <br> til at separere hold og omklædning — textContent smasher dem.
    // Erstat <br> med newline-separator inden vi parser tekst.
    function cellLines(cell) {
      if (!cell) return [];
      const html = cell.innerHTML.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
      const tmp = doc.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent.split('\n').map(s => fixDansk(s.trim())).filter(s => s);
    }

    const holdLines = cellLines(cells[2]);
    if (!holdLines.length) return;
    let homeTeam = holdLines[0].replace(/-\s*$/, '').trim();
    let awayTeam = holdLines.find(l => l !== holdLines[0] && !/^dommer$/i.test(l)) || '';
    homeTeam = homeTeam.replace(/\s*Dommer\s*$/i, '').trim();
    awayTeam = awayTeam.replace(/\s*Dommer\s*$/i, '').trim();

    const omklLines = cellLines(cells[3]);
    const omklædnHjem   = omklLines[0] || '';
    const omklædnUde    = omklLines[1] || '';
    const omklædnDommer = omklLines.find(p => /dommer/i.test(p)) || '';

    matches.push({ date: currentDate, time: startTime, aargang, homeTeam, awayTeam,
      omklædnHjem, omklædnUde, omklædnDommer, bane });
  });
  return matches;
}

async function fetchMatches() {
  const today = new Date();

  // Beregn datostrengen for de næste 3 dage
  const nearDates = new Set();
  for (let i = 0; i < 3; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    nearDates.add(formatDate(d));
  }

  // Hent alle fremtidige kampe fra matches.json
  let allJsonMatches = [];
  try {
    const r = await fetch('matches.json?' + Date.now());
    const data = await r.json();
    const todayMidnight = new Date(today); todayMidnight.setHours(0,0,0,0);
    allJsonMatches = data
      .map(m => {
        const [dd,mm,yyyy] = m.date.split('-');
        return { ...m, date: new Date(`${yyyy}-${mm}-${dd}`) };
      })
      .filter(m => { const d = new Date(m.date); d.setHours(0,0,0,0); return d >= todayMidnight; });
  } catch(e) {}

  // Prioriter de næste 3 dage — ellers vis de nærmest kommende kampe
  let jsonMatches = allJsonMatches.filter(m => {
    const [dd,mm,yyyy] = [
      String(m.date.getDate()).padStart(2,'0'),
      String(m.date.getMonth()+1).padStart(2,'0'),
      m.date.getFullYear()
    ];
    return nearDates.has(`${dd}-${mm}-${yyyy}`);
  });

  if (jsonMatches.length === 0 && allJsonMatches.length > 0) {
    // Ingen kampe de næste 3 dage — vis de næste MATCHES_PER_PAGE kommende
    jsonMatches = allJsonMatches
      .sort((a, b) => new Date(a.date) - new Date(b.date))
      .slice(0, MATCHES_PER_PAGE);
  }

  // Hent alle kampe fra DBU (supplement — inkl. fremtidige)
  let dbuMatches = [];
  const html = await fetchViaProxy(DBU_BASE);
  if (html) {
    const parsed = parseMatchesFromHTML(html, today);
    const jsonKeys = new Set(allJsonMatches.map(m => {
      const d = new Date(m.date);
      return formatDate(d) + '|' + m.time + '|' + m.homeTeam.toLowerCase();
    }));
    dbuMatches = parsed.filter(m => {
      const key = formatDate(new Date(m.date)) + '|' + m.time + '|' + m.homeTeam.toLowerCase();
      return !jsonKeys.has(key);
    });
  }

  const allMatches = [...jsonMatches, ...dbuMatches].sort((a, b) => {
    const da = new Date(a.date); da.setHours(0,0,0,0);
    const db = new Date(b.date); db.setHours(0,0,0,0);
    if (da.getTime() !== db.getTime()) return da - db;
    const [ah, am] = a.time.split(':').map(Number);
    const [bh, bm] = b.time.split(':').map(Number);
    return (ah * 60 + am) - (bh * 60 + bm);
  });

  const todayMidnightMs = new Date(today).setHours(0,0,0,0);
  const visibleMatches = allMatches.filter(m => {
    const mDate = new Date(m.date); mDate.setHours(0,0,0,0);
    return mDate.getTime() >= todayMidnightMs;
  });

  if (visibleMatches.length > 0) renderMatches(visibleMatches);
  else renderNoMatches();

}

const MATCHES_PER_PAGE = 5;
let _allMatches = [];
let _currentPage = 0;
let _pageTimer = null;

function renderMatches(matches) {
  _allMatches = matches;
  _currentPage = 0;
  clearInterval(_pageTimer);

  const totalPages = Math.ceil(matches.length / MATCHES_PER_PAGE);
  if (totalPages > 1) {
    _pageTimer = setInterval(() => {
      _currentPage = (_currentPage + 1) % Math.ceil(_allMatches.length / MATCHES_PER_PAGE);
      showMatchPage(_currentPage);
    }, 9000);
  }

  showMatchPage(0);
}

function showMatchPage(page) {
  const list = document.getElementById('matches-list');
  list.innerHTML = '';

  const matches = _allMatches;
  const totalPages = Math.ceil(matches.length / MATCHES_PER_PAGE);
  const start = page * MATCHES_PER_PAGE;
  const pageMatches = matches.slice(start, start + MATCHES_PER_PAGE);

  const indicator = document.getElementById('page-indicator');
  if (indicator) {
    if (totalPages > 1) {
      indicator.textContent = `${page + 1}/${totalPages}`;
      indicator.classList.add('visible');
    } else {
      indicator.textContent = '';
      indicator.classList.remove('visible');
    }
  }

  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const today = new Date(); today.setHours(0,0,0,0);

  let nextIdx = -1;
  for (let i = 0; i < matches.length; i++) {
    const m = matches[i];
    const mDate = new Date(m.date); mDate.setHours(0,0,0,0);
    const [h, min] = m.time.split(':').map(Number);
    if (mDate > today || (mDate.getTime() === today.getTime() && (h*60+min) >= nowMins)) {
      nextIdx = i; break;
    }
  }

  pageMatches.forEach((m, localI) => {
    const i = start + localI;
    const isNext = i === nextIdx;
    const c = document.createElement('div');
    c.className = 'match-card' + (isNext ? ' next-match' : '');
    c.innerHTML = `
      <div class="match-date-col">
        <div class="match-date-day">${m.time}</div>
      </div>
      <div class="match-teams">
        ${isNext ? '<span class="next-badge">Næste kamp</span>' : ''}
        <div class="match-teams-row">
          <span class="match-team">${m.homeTeam}</span>
          ${m.awayTeam ? `<span class="match-vs">–</span><span class="match-team">${m.awayTeam}</span>` : ''}
        </div>
        <div class="match-league">${m.aargang}</div>
        <div class="match-omk">
          ${m.omklædnHjem   ? `<span class="omk-badge omk-hjem">Hjem: ${m.omklædnHjem}</span>`    : ''}
          ${m.omklædnUde    ? `<span class="omk-sep">·</span><span class="omk-badge omk-ude">Ude: ${m.omklædnUde}</span>`       : ''}
          ${m.omklædnDommer ? `<span class="omk-sep">·</span><span class="omk-badge omk-dom">Dommer: ${m.omklædnDommer}</span>` : ''}
        </div>
      </div>
      <div class="match-bane-col">
        ${m.bane ? (() => { const col = getBaneColor(m.bane); return `<div class="match-bane-label">Bane</div><div class="match-bane-value" style="background:${col.bg};color:${col.text}">${m.bane}</div>`; })() : ''}
      </div>`;
    list.appendChild(c);
  });
}

function renderNoMatches() {
  document.getElementById('matches-list').innerHTML = '<div class="no-matches">Ingen kampe i dag 🏟️</div>';
}


fetchMatches();
setInterval(fetchMatches, 900000);

    { name: 'Rema 1000',       logo: 'https://587-lystrup-if.euwest01.umbraco.io/media/1502/skaermbillede-2025-04-28-kl-17-34-21.png' },
    { name: 'Netto',           logo: 'https://587-lystrup-if.euwest01.umbraco.io/media/1509/skaermbillede-2025-05-21-kl-17-59-19.png' },
    { name: 'Djurslands Bank', logo: 'https://587-lystrup-if.euwest01.umbraco.io/media/1514/djurslands-bank-logo.png' },
    { name: 'Burger King',     logo: 'https://587-lystrup-if.euwest01.umbraco.io/media/1594/skaermbillede-2026-05-03-kl-08-59-47.png' },
    { name: 'Kold og Nygaard', logo: 'https://587-lystrup-if.euwest01.umbraco.io/media/1595/skaermbillede-2026-05-03-kl-09-00-59.png' },
  ];

  const bar = document.getElementById('sponsor-bar');
  sponsors.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'sponsor-item';
    item.innerHTML = `<img src="${s.logo}" alt="${s.name}" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\'sponsor-name-text\'>${s.name}</span>')">`;
    bar.appendChild(item);
    if (i < sponsors.length - 1) {
      const div = document.createElement('div');
      div.className = 'sponsor-divider';
      bar.appendChild(div);
    }
  });
}
loadSponsors();

}

// ─── SKJUL CURSOR EFTER 1.5 SEK INAKTIVITET ───
document.documentElement.classList.add('cursor-hidden');
let _cursorTimer;
document.addEventListener('mousemove', () => {
  document.documentElement.classList.remove('cursor-hidden');
  clearTimeout(_cursorTimer);
  _cursorTimer = setTimeout(() => document.documentElement.classList.add('cursor-hidden'), 1500);
});
</script>
<script>
// Genindlæs siden hver 30. minut så kodeændringer fra GitHub slår igennem automatisk
setInterval(() => location.reload(), 30 * 60 * 1000);

// Watchdog: for mange JS-fejl → genindlæs
let _errCount = 0;
window.onerror = function() {
  _errCount++;
  if (_errCount >= 5) setTimeout(() => location.reload(), 3000);
  return true;
};
window.addEventListener('unhandledrejection', function() {
  _errCount++;
  if (_errCount >= 5) setTimeout(() => location.reload(), 3000);
});
</script>
